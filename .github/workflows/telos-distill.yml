name: TELOS 信号蒸馏

on:
  schedule:
    - cron: '7 */4 * * *'   # 每 4 小时执行（UTC 分钟非整点，避免扎堆）
  workflow_dispatch:

jobs:
  distill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: hua-qi/huaqi-I
          path: huaqi-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pull latest and configure git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Huaqi Bot"
          git config user.email "bot@huaqi.local"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main

      - name: Install huaqi
        run: pip install -e huaqi-src/

      - name: Run TELOS distillation
        id: distill
        env:
          HUAQI_DATA_DIR: ${{ github.workspace }}
          HUAQI_SKIP_RECOVERY: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          huaqi telos distill --limit 10

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add telos/ raw_signals.db events.db scheduler.db 2>/dev/null || true
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: telos distillation $(date +%F-%H%M)"
            git push
          fi

      - name: Notify success
        if: success()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          FILE_URL="https://github.com/${{ github.repository }}/tree/main/telos/"
          bash .github/workflows/notify.sh \
            "✅ TELOS 信号蒸馏完成" \
            "TELOS 知识图谱已更新，[点击查看详情](${FILE_URL})"

      - name: Notify failure
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          bash .github/workflows/notify.sh \
            "❌ TELOS 信号蒸馏失败" \
            "请查看运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
